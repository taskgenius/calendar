name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.1)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write      # Required for OIDC authentication with npm
  contents: write      # Required for creating GitHub releases

jobs:
  publish:
    name: Manual Publish Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to latest version
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify version in package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "${{ inputs.version }}" ]; then
            echo "Error: Version in package.json ($PACKAGE_VERSION) does not match input version (${{ inputs.version }})"
            exit 1
          fi
          echo "Version verified: $PACKAGE_VERSION"

      - name: Publish to npm (with OIDC)
        run: npm publish
        # No NPM_TOKEN needed - OIDC authentication is automatic

      - name: Create GitHub Release
        if: inputs.create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version }}
          release_name: Release v${{ inputs.version }}
          body: |
            ## Manual Release v${{ inputs.version }}

            This release was manually triggered.

            ## Installation

            ```bash
            npm install @taskgenius/calendar@${{ inputs.version }}
            ```

            ## Package Details

            - **npm**: https://www.npmjs.com/package/@taskgenius/calendar/v/${{ inputs.version }}
            - **Provenance**: Automatically generated ✅
          draft: false
          prerelease: false
