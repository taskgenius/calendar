name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write      # Required for OIDC authentication with npm
  contents: write      # Required for creating GitHub releases

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to latest version
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm (with OIDC)
        run: npm publish
        # No NPM_TOKEN needed - OIDC authentication is automatic

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            See the [CHANGELOG](https://github.com/taskgenius/calendar/blob/main/CHANGELOG.md) for details.

            ## Installation

            ```bash
            npm install @taskgenius/calendar@${{ steps.get_version.outputs.VERSION }}
            ```

            ## Package Details

            - **npm**: https://www.npmjs.com/package/@taskgenius/calendar/v/${{ steps.get_version.outputs.VERSION }}
            - **Provenance**: Automatically generated ✅
          draft: false
          prerelease: false
